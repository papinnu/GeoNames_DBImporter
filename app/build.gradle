plugins {
    id 'java'
    id 'application'
    id 'io.freefair.lombok' version '9.0.0'
    id 'com.adarshr.test-logger' version '4.0.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.26'

    implementation 'org.slf4j:slf4j-api:2.0.17'
    testImplementation 'org.slf4j:slf4j-simple:2.0.17'

    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation("org.junit.jupiter:junit-jupiter-params:5.10.2")

    testImplementation 'org.testcontainers:testcontainers-bom:2.0.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:mysql:1.21.4'
    testImplementation 'org.testcontainers:oracle-xe:1.21.4'
    testImplementation 'org.testcontainers:mssqlserver:1.21.4'

    testImplementation 'com.mysql:mysql-connector-j:9.6.0'
    testImplementation 'org.postgresql:postgresql:42.7.10'
    testImplementation 'com.microsoft.sqlserver:mssql-jdbc:13.4.0.jre11'

    testImplementation 'com.zaxxer:HikariCP-java6:2.3.13'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

distributions {
    main {
        contents {
            from(projectDir) {
                include '*.md'
            }
        }
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.papi.geonames.dbimporter.App'
}

test {
    environment "TESTCONTAINERS_RYUK_DISABLED", "true"
    useJUnitPlatform()
    testlogger {
        theme 'mocha' // project level
        slowThreshold 500
        showSimpleNames true
        showStandardStreams true
        logLevel 'lifecycle'
    }
//    debugOptions {
//        enabled = true
//        port = 5005
//        server = true
//        suspend = true
//    }
}
